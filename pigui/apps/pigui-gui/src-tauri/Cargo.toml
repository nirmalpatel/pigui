[package]
name = "pigui-gui"
version = "0.1.0"
description = "PIGUI desktop shell"
edition = "2024"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pigui-core = { path = "../../../crates/pigui-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[workspace]
