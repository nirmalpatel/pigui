[workspace]
resolver = "2"
members = [
    "crates/pigui-core",
    "crates/pigui-snort",
    "crates/pigui-collector",
    "crates/pigui-firewall",
    "crates/pigui-daemon",
    "crates/pigui-helper",
    "crates/pigui-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
psl = "2"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

pigui-core = { path = "crates/pigui-core" }
pigui-snort = { path = "crates/pigui-snort" }
pigui-collector = { path = "crates/pigui-collector" }
pigui-firewall = { path = "crates/pigui-firewall" }
pigui-daemon = { path = "crates/pigui-daemon" }
